server:
  port: 10085

spring:
  application:
    name: insight-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/study_insight?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root123456
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2s

# 今日待练缓存：Redis 挂了就直连数据库，不影响功能
app:
  cache:
    enabled: true
    due-ttl-seconds: 60

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# 全局事务参与者：被 practice 的 @GlobalTransactional 带进来
seata:
  enabled: ${SEATA_ENABLED:false}
  application-id: insight-service
  tx-service-group: study-loop-tx
  service:
    vgroup-mapping:
      study-loop-tx: default
    grouplist:
      default: 127.0.0.1:8091
  registry:
    type: file
  config:
    type: file

knife4j:
  enable: true
