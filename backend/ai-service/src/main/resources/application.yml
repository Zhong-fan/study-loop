server:
  port: 8086

spring:
  application:
    name: ai-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/study_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root123456
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

# 大模型配置：不填 Key 时服务照常启动，接口返回"未配置"
app:
  ai:
    enabled: false
    base-url: https://api.deepseek.com
    model: deepseek-chat
    api-key: ""
    timeout-seconds: 60

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

knife4j:
  enable: true
