server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 10086

spring:
  application:
    name: ai-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/study_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root123456
  cloud:
    nacos:
      discovery:
        ip: ${NACOS_IP:127.0.0.1}
        server-addr: 127.0.0.1:8848

# 大模型配置：key 从环境变量读，仓库里不放明文
app:
  internal:
    enabled: true
    token: ${INTERNAL_TOKEN:dev-internal-token}
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    model: ${AI_MODEL:deepseek-chat}
    api-key: ${AI_API_KEY:}
    strict: ${AI_STRICT:false}
    timeout-seconds: 60

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

knife4j:
  enable: true
