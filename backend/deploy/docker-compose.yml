# 只起中间件：MySQL 和 Nacos
# 四个 Java 服务在 IDEA 里启动，改代码不用重新打包
#
# 启动：docker compose up -d
# 查看：docker compose ps

services:
  mysql:
    image: mysql:8.0
    container_name: study-loop-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动时按文件名顺序执行，自动建库建表
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: study-loop-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8848/nacos/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
