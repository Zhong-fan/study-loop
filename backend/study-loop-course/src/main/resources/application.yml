server:
  port: 8082

spring:
  application:
    name: study-loop-course
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/study_course?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root123456
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

mybatis-plus:
  configuration:
    # 数据库字段 course_name 自动映射到 Java 的 courseName
    map-underscore-to-camel-case: true
    # 开发阶段打印 SQL，上线要关掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

knife4j:
  enable: true

logging:
  level:
    com.studyloop.course: debug
