server:
  port: 8083

spring:
  application:
    name: practice-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/study_review?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root123456
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# 全局事务：作答要同时写 practice 的 attempt 和 insight 的 mastery。
# 默认关闭，起 seata-server 后把 SEATA_ENABLED 设为 true 再启动服务。
seata:
  enabled: ${SEATA_ENABLED:true}
  application-id: practice-service
  tx-service-group: study-loop-tx
  service:
    vgroup-mapping:
      study-loop-tx: default
    grouplist:
      default: 127.0.0.1:8091
  registry:
    type: file
  config:
    type: file

knife4j:
  enable: true

logging:
  level:
    com.studyloop.practice: debug
