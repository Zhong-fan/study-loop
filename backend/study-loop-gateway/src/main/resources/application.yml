server:
  port: 8080

spring:
  application:
    name: study-loop-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      routes:
        - id: auth
          uri: lb://study-loop-auth
          predicates:
            - Path=/api/auth/**
        - id: course
          uri: lb://study-loop-course
          predicates:
            # 一个服务可以有多个路径前缀，逗号分隔
            - Path=/api/courses/**,/api/chapters/**,/api/materials/**
        - id: review
          uri: lb://study-loop-review
          predicates:
            - Path=/api/review/**,/api/questions/**,/api/quizzes/**

logging:
  level:
    org.springframework.cloud.gateway: info
