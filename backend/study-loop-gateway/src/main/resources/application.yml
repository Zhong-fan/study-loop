server:
  port: 8080

spring:
  application:
    name: study-loop-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      routes:
        - id: auth
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**
        - id: course
          uri: lb://content-service
          predicates:
            # 一个服务可以有多个路径前缀，逗号分隔
            - Path=/api/courses/**,/api/chapters/**,/api/materials/**,/api/knowledge/**
        - id: practice
          uri: lb://practice-service
          predicates:
            - Path=/api/review/**,/api/questions/**,/api/quizzes/**
        - id: insight
          uri: lb://insight-service
          predicates:
            - Path=/api/insight/**
        - id: ai
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**

logging:
  level:
    org.springframework.cloud.gateway: info
